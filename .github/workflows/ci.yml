name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install
        run: composer install --no-interaction --no-progress

      - name: Smoke tests
        run: php tests/smoke.php

      - name: Acceptance tests
        run: php tests/acceptance.php

      - name: Dictionary and quality gates
        run: php tests/i18n.php
        run: php tests/i18n.php software-2026

  no_network:
    name: Zero network access
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, mbstring
          tools: composer:v2

      - name: The engine must not contain any networking code
        run: |
          if grep -rniE 'curl_init|curl_exec|fsockopen|pfsockopen|stream_context_create|xmlrpc_request|wp_remote_get|file_get_contents\(.?["'"'"']?https?:' src/ ; then
            echo "::error::Networking code found in src/"
            exit 1
          fi
          echo "No networking code in src/"

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, mbstring, pdo_sqlite
          tools: composer:v2

      - name: Measure
        run: php tests/benchmark.php