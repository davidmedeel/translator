name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install
        run: composer install --no-interaction --no-progress

      - name: Smoke tests
        run: php tests/smoke.php

      - name: Acceptance tests
        run: php tests/acceptance.php

      - name: Dictionary gates, product page
        run: php tests/i18n.php tokify

      - name: Dictionary gates, article
        run: php tests/i18n.php software-2026

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, mbstring, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Measure
        run: php tests/benchmark.php